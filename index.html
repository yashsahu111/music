<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify Personal</title>

  <!-- PWA & Mobile Display Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .spotify-green { color: #1DB954; }
    .bg-spotify-green { background-color: #1DB954; }
    .bg-spotify-card { background-color: #181818; }
    .bg-spotify-card:active { background-color: #282828; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    input[type="range"] {
      accent-color: #1DB954;
    }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

  <!-- Network Status Indicator -->
  <div id="offline-banner" class="hidden bg-amber-600 text-black text-xs font-bold py-1 text-center">
    Offline Mode — Playing Local Songs
  </div>

  <!-- Main Scrollable Screen -->
  <div class="flex-1 overflow-y-auto no-scrollbar pb-36 p-4" id="main-content">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center mb-5 pt-2">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Your Music</h1>
        <p class="text-xs text-zinc-400">Offline & Online Player</p>
      </div>
      <label for="file-upload" class="bg-spotify-green hover:bg-green-600 text-black font-bold px-4 py-2 rounded-full flex items-center gap-2 cursor-pointer text-xs transition shadow-md">
        <i data-lucide="folder-plus" class="w-4 h-4"></i> Add Local MP3s
      </label>
      <input id="file-upload" type="file" accept="audio/*" multiple class="hidden">
    </div>

    <!-- Search Input -->
    <div class="relative mb-5">
      <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400"></i>
      <input type="text" id="search-input" placeholder="Search library..." class="w-full bg-[#242424] text-white text-sm rounded-full pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>

    <!-- Section Tabs -->
    <div class="flex gap-2 mb-4 border-b border-zinc-800 pb-2">
      <button onclick="switchTab('all')" id="tab-all" class="text-xs font-bold px-3 py-1.5 rounded-full bg-white text-black">All Songs</button>
      <button onclick="switchTab('online')" id="tab-online" class="text-xs font-bold px-3 py-1.5 rounded-full bg-zinc-800 text-zinc-300">Online Stream</button>
      <button onclick="switchTab('local')" id="tab-local" class="text-xs font-bold px-3 py-1.5 rounded-full bg-zinc-800 text-zinc-300">Local Uploads</button>
    </div>

    <!-- Track List -->
    <div class="space-y-2" id="song-list"></div>
  </div>

  <!-- Sticky Mini Player -->
  <div id="mini-player" class="fixed bottom-0 left-0 right-0 bg-[#181818] border-t border-zinc-800 p-3 flex items-center justify-between z-40 shadow-2xl">
    <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="openFullPlayer()">
      <img id="player-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=60" class="w-12 h-12 rounded-md object-cover flex-shrink-0" alt="Cover">
      <div class="overflow-hidden pr-2">
        <p id="player-title" class="text-sm font-semibold truncate text-white">Select a track</p>
        <p id="player-artist" class="text-xs text-zinc-400 truncate">Tap to open player</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="togglePlayPause()" class="w-10 h-10 rounded-full bg-spotify-green text-black flex items-center justify-center focus:outline-none">
        <i id="play-icon" data-lucide="play" class="w-5 h-5 fill-current"></i>
      </button>
      <button onclick="playNext()" class="text-zinc-400 p-1">
        <i data-lucide="skip-forward" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <!-- Full Screen Player Modal -->
  <div id="full-player" class="fixed inset-0 bg-gradient-to-b from-zinc-900 via-zinc-950 to-black z-50 transform translate-y-full transition-transform duration-300 ease-in-out flex flex-col justify-between p-6">
    <div class="flex justify-between items-center">
      <button onclick="closeFullPlayer()" class="text-zinc-400 p-2">
        <i data-lucide="chevron-down" class="w-7 h-7"></i>
      </button>
      <span class="text-xs uppercase tracking-widest text-zinc-400 font-bold">Now Playing</span>
      <div class="w-7"></div>
    </div>

    <div class="my-auto py-6 flex justify-center">
      <img id="full-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60" class="w-72 h-72 rounded-xl object-cover shadow-2xl border border-zinc-800" alt="Cover">
    </div>

    <div>
      <div class="flex justify-between items-center mb-6">
        <div class="overflow-hidden pr-4">
          <h2 id="full-title" class="text-xl font-bold text-white truncate">Select a track</h2>
          <p id="full-artist" class="text-sm text-zinc-400 truncate">Tap to play music</p>
        </div>
      </div>

      <div class="mb-6">
        <input type="range" id="seek-bar" value="0" max="100" class="w-full h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer">
        <div class="flex justify-between text-xs text-zinc-400 mt-2">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="flex justify-between items-center mb-8 px-6">
        <button onclick="playPrev()" class="text-white">
          <i data-lucide="skip-back" class="w-8 h-8"></i>
        </button>
        <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full bg-spotify-green text-black flex items-center justify-center shadow-lg">
          <i id="full-play-icon" data-lucide="play" class="w-8 h-8 fill-current"></i>
        </button>
        <button onclick="playNext()" class="text-white">
          <i data-lucide="skip-forward" class="w-8 h-8"></i>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio-element" preload="auto"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Default Online Music Tracks (Free Royalty Streams)
    let songs = [
      {
        id: 'online-1',
        title: 'Acoustic Breeze',
        artist: 'Benjamin Tissot',
        cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=60',
        url: 'https://www.bensound.com/bensound-music/bensound-acousticbreeze.mp3',
        type: 'online'
      },
      {
        id: 'online-2',
        title: 'Creative Minds',
        artist: 'Benjamin Tissot',
        cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop&q=60',
        url: 'https://www.bensound.com/bensound-music/bensound-creativeminds.mp3',
        type: 'online'
      },
      {
        id: 'online-3',
        title: 'Ukulele Joy',
        artist: 'Benjamin Tissot',
        cover: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&auto=format&fit=crop&q=60',
        url: 'https://www.bensound.com/bensound-music/bensound-ukulele.mp3',
        type: 'online'
      }
    ];

    let currentTab = 'all';
    let currentIndex = -1;
    let isPlaying = false;

    const audio = document.getElementById('audio-element');
    const songListEl = document.getElementById('song-list');
    const searchInput = document.getElementById('search-input');
    const seekBar = document.getElementById('seek-bar');

    window.onload = () => {
      lucide.createIcons();
      renderSongs();
      checkNetworkStatus();
    };

    window.addEventListener('online', checkNetworkStatus);
    window.addEventListener('offline', checkNetworkStatus);

    function checkNetworkStatus() {
      const banner = document.getElementById('offline-banner');
      if (!navigator.onLine) {
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      ['all', 'online', 'local'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "text-xs font-bold px-3 py-1.5 rounded-full bg-white text-black";
        } else {
          btn.className = "text-xs font-bold px-3 py-1.5 rounded-full bg-zinc-800 text-zinc-300";
        }
      });
      renderSongs();
    }

    function renderSongs() {
      songListEl.innerHTML = '';
      
      let filtered = songs;
      if (currentTab === 'online') filtered = songs.filter(s => s.type === 'online');
      if (currentTab === 'local') filtered = songs.filter(s => s.type === 'local');

      const query = searchInput.value.toLowerCase();
      if (query) {
        filtered = filtered.filter(s => s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query));
      }

      if (filtered.length === 0) {
        songListEl.innerHTML = `<p class="text-center text-zinc-500 py-10 text-xs">No tracks found. Upload local MP3 files to listen offline!</p>`;
        return;
      }

      filtered.forEach((song) => {
        const index = songs.findIndex(s => s.id === song.id);
        const isCurrent = currentIndex === index;

        const card = document.createElement('div');
        card.className = `flex items-center justify-between p-3 rounded-lg cursor-pointer bg-spotify-card transition ${isCurrent ? 'border-l-4 border-green-500' : ''}`;
        card.onclick = () => playSong(index);

        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <img src="${song.cover}" class="w-12 h-12 rounded-md object-cover flex-shrink-0" alt="Cover">
            <div class="overflow-hidden">
              <p class="text-sm font-semibold truncate ${isCurrent ? 'text-green-500' : 'text-white'}">${song.title}</p>
              <p class="text-xs text-zinc-400 truncate">${song.artist} • <span class="uppercase text-[10px] text-zinc-500">${song.type}</span></p>
            </div>
          </div>
          ${song.type === 'local' ? `
            <button onclick="event.stopPropagation(); removeSong('${song.id}')" class="text-zinc-500 hover:text-red-400 p-2">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          ` : ''}
        `;
        songListEl.appendChild(card);
      });
      lucide.createIcons();
    }

    function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentIndex = index;
      const song = songs[currentIndex];

      audio.src = song.url;
      audio.play().then(() => {
        isPlaying = true;
        updateUI();
        setupMediaSession(song);
      }).catch(err => {
        console.log("Audio play error:", err);
      });
    }

    function togglePlayPause() {
      if (currentIndex === -1 && songs.length > 0) {
        playSong(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateUI();
    }

    function updateUI() {
      if (currentIndex === -1) return;
      const song = songs[currentIndex];

      document.getElementById('player-cover').src = song.cover;
      document.getElementById('player-title').innerText = song.title;
      document.getElementById('player-artist').innerText = song.artist;

      document.getElementById('full-cover').src = song.cover;
      document.getElementById('full-title').innerText = song.title;
      document.getElementById('full-artist').innerText = song.artist;

      const playIcon = isPlaying ? 'pause' : 'play';
      document.getElementById('play-icon').setAttribute('data-lucide', playIcon);
      document.getElementById('full-play-icon').setAttribute('data-lucide', playIcon);

      renderSongs();
      lucide.createIcons();
    }

    function playNext() {
      if (songs.length === 0) return;
      let nextIndex = (currentIndex + 1) % songs.length;
      playSong(nextIndex);
    }

    function playPrev() {
      if (songs.length === 0) return;
      let prevIndex = (currentIndex - 1 + songs.length) % songs.length;
      playSong(prevIndex);
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        seekBar.value = progress;
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-duration').innerText = formatTime(audio.duration);
      }
    };

    audio.onended = () => playNext();

    seekBar.oninput = () => {
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    };

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    document.getElementById('file-upload').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach((file) => {
        const url = URL.createObjectURL(file);
        
        jsmediatags.read(file, {
          onSuccess: function(tag) {
            const tags = tag.tags;
            let coverUrl = 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=60';
            
            if (tags.picture) {
              const { data, format } = tags.picture;
              let base64String = "";
              for (let i = 0; i < data.length; i++) {
                base64String += String.fromCharCode(data[i]);
              }
              coverUrl = `data:${format};base64,${window.btoa(base64String)}`;
            }

            songs.push({
              id: 'local-' + Date.now() + Math.random(),
              title: tags.title || file.name.replace(/\.[^/.]+$/, ""),
              artist: tags.artist || "Local Audio File",
              cover: coverUrl,
              url: url,
              type: 'local'
            });

            renderSongs();
            if (currentIndex === -1) playSong(songs.length - 1);
          },
          onError: function() {
            songs.push({
              id: 'local-' + Date.now(),
              title: file.name.replace(/\.[^/.]+$/, ""),
              artist: "Local Audio File",
              cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=60',
              url: url,
              type: 'local'
            });
            renderSongs();
            if (currentIndex === -1) playSong(songs.length - 1);
          }
        });
      });
    });

    function removeSong(id) {
      songs = songs.filter(s => s.id !== id);
      renderSongs();
    }

    searchInput.oninput = () => renderSongs();

    function openFullPlayer() {
      document.getElementById('full-player').classList.remove('translate-y-full');
    }
    function closeFullPlayer() {
      document.getElementById('full-player').classList.add('translate-y-full');
    }

    function setupMediaSession(song) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title,
          artist: song.artist,
          artwork: [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
      }
    }
  </script>
</body>
</html>
