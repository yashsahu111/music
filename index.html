<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify Personal - Full Songs</title>

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121212">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .spotify-green { color: #1DB954; }
    .bg-spotify-green { background-color: #1DB954; }
    .bg-spotify-card { background-color: #181818; }
    .bg-spotify-card:active { background-color: #282828; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="range"] { accent-color: #1DB954; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

  <!-- Main Scroll View -->
  <div class="flex-1 overflow-y-auto no-scrollbar pb-36 p-4">
    
    <div class="flex justify-between items-center mb-4 pt-2">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Spotify Music</h1>
        <p class="text-xs text-zinc-400">Full Songs & Discographies</p>
      </div>
    </div>

    <!-- Search Controls -->
    <div class="flex gap-2 mb-4">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400"></i>
        <input type="text" id="search-input" placeholder="Search artist or full song (e.g., Shubh)..." class="w-full bg-[#242424] text-white text-sm rounded-full pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500" onkeypress="if(event.key === 'Enter') searchFullSongs()">
      </div>
      <button onclick="searchFullSongs()" class="bg-spotify-green hover:bg-green-600 text-black font-bold px-4 py-2.5 rounded-full text-xs transition">
        Search
      </button>
    </div>

    <!-- Results Count -->
    <div id="results-count" class="text-xs text-zinc-400 mb-3 hidden"></div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="hidden text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-green-500"></div>
      <p class="text-xs text-zinc-400 mt-2">Loading full songs catalog...</p>
    </div>

    <!-- Song List -->
    <div class="space-y-2" id="song-list"></div>
  </div>

  <!-- Hidden YouTube Engine -->
  <div class="hidden">
    <div id="yt-player"></div>
  </div>

  <!-- Sticky Mini Player -->
  <div id="mini-player" class="fixed bottom-0 left-0 right-0 bg-[#181818] border-t border-zinc-800 p-3 flex items-center justify-between z-40 shadow-2xl">
    <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="openFullPlayer()">
      <img id="player-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=60" class="w-12 h-12 rounded-md object-cover flex-shrink-0" alt="Cover">
      <div class="overflow-hidden pr-2">
        <p id="player-title" class="text-sm font-semibold truncate text-white">Select a track</p>
        <p id="player-artist" class="text-xs text-zinc-400 truncate">Tap to open player</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="togglePlayPause()" class="w-10 h-10 rounded-full bg-spotify-green text-black flex items-center justify-center">
        <i id="play-icon" data-lucide="play" class="w-5 h-5 fill-current"></i>
      </button>
      <button onclick="playNext()" class="text-zinc-400 p-1">
        <i data-lucide="skip-forward" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <!-- Full Screen Player Modal -->
  <div id="full-player" class="fixed inset-0 bg-gradient-to-b from-zinc-900 via-zinc-950 to-black z-50 transform translate-y-full transition-transform duration-300 ease-in-out flex flex-col justify-between p-6">
    <div class="flex justify-between items-center">
      <button onclick="closeFullPlayer()" class="text-zinc-400 p-2">
        <i data-lucide="chevron-down" class="w-7 h-7"></i>
      </button>
      <span class="text-xs uppercase tracking-widest text-zinc-400 font-bold">Now Playing Full Track</span>
      <div class="w-7"></div>
    </div>

    <div class="my-auto py-6 flex justify-center">
      <img id="full-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60" class="w-72 h-72 rounded-xl object-cover shadow-2xl border border-zinc-800" alt="Cover">
    </div>

    <div>
      <div class="mb-6">
        <h2 id="full-title" class="text-xl font-bold text-white truncate">Select a track</h2>
        <p id="full-artist" class="text-sm text-zinc-400 truncate">Tap to play music</p>
      </div>

      <div class="mb-6">
        <input type="range" id="seek-bar" value="0" max="100" class="w-full h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer">
        <div class="flex justify-between text-xs text-zinc-400 mt-2">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="flex justify-between items-center mb-8 px-6">
        <button onclick="playPrev()" class="text-white">
          <i data-lucide="skip-back" class="w-8 h-8"></i>
        </button>
        <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full bg-spotify-green text-black flex items-center justify-center shadow-lg">
          <i id="full-play-icon" data-lucide="play" class="w-8 h-8 fill-current"></i>
        </button>
        <button onclick="playNext()" class="text-white">
          <i data-lucide="skip-forward" class="w-8 h-8"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    let ytPlayer;
    let songs = [];
    let currentIndex = -1;
    let isPlaying = false;
    let updateTimer;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    window.onload = () => {
      lucide.createIcons();
      document.getElementById('search-input').value = 'Shubh';
      searchFullSongs();
    };

    async function searchFullSongs() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      document.getElementById('loading-spinner').classList.remove('hidden');
      document.getElementById('song-list').innerHTML = '';

      try {
        // Fetch extended results (up to 50 tracks) via Invidious API
        const res = await fetch(`https://inv.api.store/api/v1/search?q=${encodeURIComponent(query + ' full song audio')}&type=video`);
        const data = await res.json();

        songs = data.map(item => ({
          id: item.videoId,
          title: item.title,
          artist: item.author || query,
          cover: item.videoThumbnails ? item.videoThumbnails.find(t => t.quality === 'medium')?.url || item.videoThumbnails[0].url : `https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg`,
          duration: item.lengthSeconds
        }));

        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('results-count').innerText = `Found ${songs.length} full songs for "${query}"`;
        document.getElementById('results-count').classList.remove('hidden');
        renderSongs();
      } catch (err) {
        // Fallback search endpoint
        fetchFallback(query);
      }
    }

    async function fetchFallback(query) {
      try {
        const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query + ' song')}&filter=music_videos`);
        const data = await res.json();

        songs = data.items.map(item => ({
          id: item.url.split('v=')[1],
          title: item.title,
          artist: item.uploaderName || query,
          cover: item.thumbnail,
          duration: item.duration
        }));

        document.getElementById('loading-spinner').classList.add('hidden');
        renderSongs();
      } catch(e) {
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('song-list').innerHTML = '<p class="text-center text-zinc-500 py-10 text-xs">Error fetching songs. Try searching again.</p>';
      }
    }

    function renderSongs() {
      const songListEl = document.getElementById('song-list');
      songListEl.innerHTML = '';

      songs.forEach((song, idx) => {
        const isCurrent = currentIndex === idx;
        const card = document.createElement('div');
        card.className = `flex items-center justify-between p-3 rounded-lg cursor-pointer bg-spotify-card transition ${isCurrent ? 'border-l-4 border-green-500' : ''}`;
        card.onclick = () => playSong(idx);

        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden flex-1">
            <img src="${song.cover}" class="w-12 h-12 rounded-md object-cover flex-shrink-0" alt="Cover">
            <div class="overflow-hidden pr-2">
              <p class="text-sm font-semibold truncate ${isCurrent ? 'text-green-500' : 'text-white'}">${song.title}</p>
              <p class="text-xs text-zinc-400 truncate">${song.artist}</p>
            </div>
          </div>
          <span class="text-xs text-zinc-500 font-bold px-2 py-1 bg-zinc-900 rounded">FULL</span>
        `;
        songListEl.appendChild(card);
      });
      lucide.createIcons();
    }

    function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentIndex = index;
      const song = songs[currentIndex];

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(song.id);
        isPlaying = true;
        updateUI();
        startProgressLoop();
      }
    }

    function togglePlayPause() {
      if (currentIndex === -1 && songs.length > 0) {
        playSong(0);
        return;
      }
      if (!ytPlayer) return;

      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
        isPlaying = false;
      } else {
        ytPlayer.playVideo();
        isPlaying = true;
      }
      updateUI();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNext();
      } else if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updateUI();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updateUI();
      }
    }

    function updateUI() {
      if (currentIndex === -1) return;
      const song = songs[currentIndex];

      document.getElementById('player-cover').src = song.cover;
      document.getElementById('player-title').innerText = song.title;
      document.getElementById('player-artist').innerText = song.artist;

      document.getElementById('full-cover').src = song.cover;
      document.getElementById('full-title').innerText = song.title;
      document.getElementById('full-artist').innerText = song.artist;

      const playIcon = isPlaying ? 'pause' : 'play';
      document.getElementById('play-icon').setAttribute('data-lucide', playIcon);
      document.getElementById('full-play-icon').setAttribute('data-lucide', playIcon);

      renderSongs();
      lucide.createIcons();
    }

    function startProgressLoop() {
      clearInterval(updateTimer);
      updateTimer = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime && isPlaying) {
          const currentTime = ytPlayer.getCurrentTime();
          const duration = ytPlayer.getDuration();
          if (duration > 0) {
            document.getElementById('seek-bar').value = (currentTime / duration) * 100;
            document.getElementById('current-time').innerText = formatTime(currentTime);
            document.getElementById('total-duration').innerText = formatTime(duration);
          }
        }
      }, 1000);
    }

    document.getElementById('seek-bar').oninput = function() {
      if (ytPlayer && ytPlayer.getDuration) {
        const duration = ytPlayer.getDuration();
        ytPlayer.seekTo((this.value / 100) * duration, true);
      }
    };

    function playNext() {
      if (songs.length === 0) return;
      playSong((currentIndex + 1) % songs.length);
    }

    function playPrev() {
      if (songs.length === 0) return;
      playSong((currentIndex - 1 + songs.length) % songs.length);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function openFullPlayer() {
      document.getElementById('full-player').classList.remove('translate-y-full');
    }
    function closeFullPlayer() {
      document.getElementById('full-player').classList.add('translate-y-full');
    }
  </script>
</body>
</html>
