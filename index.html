<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify Personal - Full Music Engine</title>

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121212">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .spotify-green { color: #1DB954; }
    .bg-spotify-green { background-color: #1DB954; }
    .bg-spotify-card { background-color: #181818; }
    .bg-spotify-card:active { background-color: #282828; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    input[type="range"] { accent-color: #1DB954; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

  <!-- Main View -->
  <div class="flex-1 overflow-y-auto no-scrollbar pb-36 p-4">
    
    <div class="flex justify-between items-center mb-4 pt-2">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Spotify Music</h1>
        <p class="text-xs text-zinc-400">Full Songs & Complete Catalogs</p>
      </div>
    </div>

    <!-- Search Input -->
    <div class="flex gap-2 mb-4">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400"></i>
        <input type="text" id="search-input" placeholder="Search artist or song (e.g., Shubh)..." class="w-full bg-[#242424] text-white text-sm rounded-full pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500" onkeypress="if(event.key === 'Enter') searchFullSongs()">
      </div>
      <button onclick="searchFullSongs()" class="bg-spotify-green hover:bg-green-600 text-black font-bold px-4 py-2.5 rounded-full text-xs transition">
        Search
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="hidden text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-green-500"></div>
      <p class="text-xs text-zinc-400 mt-2">Fetching full songs catalog...</p>
    </div>

    <!-- Track List -->
    <div class="space-y-2" id="song-list"></div>
  </div>

  <!-- Sticky Mini Player -->
  <div id="mini-player" class="fixed bottom-0 left-0 right-0 bg-[#181818] border-t border-zinc-800 p-3 flex items-center justify-between z-40 shadow-2xl">
    <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="openFullPlayer()">
      <img id="player-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=60" class="w-12 h-12 rounded-md object-cover flex-shrink-0" alt="Cover">
      <div class="overflow-hidden pr-2">
        <p id="player-title" class="text-sm font-semibold truncate text-white">Select a track</p>
        <p id="player-artist" class="text-xs text-zinc-400 truncate">Tap to open player</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="togglePlayPause()" class="w-10 h-10 rounded-full bg-spotify-green text-black flex items-center justify-center">
        <i id="play-icon" data-lucide="play" class="w-5 h-5 fill-current"></i>
      </button>
      <button onclick="playNext()" class="text-zinc-400 p-1">
        <i data-lucide="skip-forward" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <!-- Full Screen Player Modal -->
  <div id="full-player" class="fixed inset-0 bg-gradient-to-b from-zinc-900 via-zinc-950 to-black z-50 transform translate-y-full transition-transform duration-300 ease-in-out flex flex-col justify-between p-6">
    <div class="flex justify-between items-center">
      <button onclick="closeFullPlayer()" class="text-zinc-400 p-2">
        <i data-lucide="chevron-down" class="w-7 h-7"></i>
      </button>
      <span class="text-xs uppercase tracking-widest text-zinc-400 font-bold">Now Playing</span>
      <div class="w-7"></div>
    </div>

    <div class="my-auto py-6 flex justify-center">
      <img id="full-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60" class="w-72 h-72 rounded-xl object-cover shadow-2xl border border-zinc-800" alt="Cover">
    </div>

    <div>
      <div class="mb-6">
        <h2 id="full-title" class="text-xl font-bold text-white truncate">Select a track</h2>
        <p id="full-artist" class="text-sm text-zinc-400 truncate">Tap to play music</p>
      </div>

      <div class="mb-6">
        <input type="range" id="seek-bar" value="0" max="100" class="w-full h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer">
        <div class="flex justify-between text-xs text-zinc-400 mt-2">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="flex justify-between items-center mb-8 px-6">
        <button onclick="playPrev()" class="text-white">
          <i data-lucide="skip-back" class="w-8 h-8"></i>
        </button>
        <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full bg-spotify-green text-black flex items-center justify-center shadow-lg">
          <i id="full-play-icon" data-lucide="play" class="w-8 h-8 fill-current"></i>
        </button>
        <button onclick="playNext()" class="text-white">
          <i data-lucide="skip-forward" class="w-8 h-8"></i>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio-element" preload="auto"></audio>

  <script>
    let songs = [];
    let currentIndex = -1;
    let isPlaying = false;

    const audio = document.getElementById('audio-element');
    const songListEl = document.getElementById('song-list');
    const searchInput = document.getElementById('search-input');
    const seekBar = document.getElementById('seek-bar');

    window.onload = () => {
      lucide.createIcons();
      searchInput.value = 'Shubh';
      searchFullSongs();
    };

    // JSONP Engine (Bypasses CORS restrictions completely)
    function searchFullSongs() {
      const query = searchInput.value.trim();
      if (!query) return;

      document.getElementById('loading-spinner').classList.remove('hidden');
      songListEl.innerHTML = '';

      // Remove existing JSONP script tag if any
      const existingScript = document.getElementById('jsonp-script');
      if (existingScript) existingScript.remove();

      // Create JSONP script injection
      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `https://www.jiosaavn.com/api.php?__call=autocomplete.get&query=${encodeURIComponent(query)}&_format=json&_marker=0&ctx=web64s&api_version=4&callback=handleSaavnResponse`;
      
      script.onerror = () => {
        document.getElementById('loading-spinner').classList.add('hidden');
        songListEl.innerHTML = `<p class="text-center text-zinc-500 py-10 text-xs">Search error. Please try again.</p>`;
      };

      document.body.appendChild(script);
    }

    // Callback Function for JSONP
    window.handleSaavnResponse = function(data) {
      document.getElementById('loading-spinner').classList.add('hidden');

      if (data && data.songs && data.songs.data && data.songs.data.length > 0) {
        songs = data.songs.data.map(item => {
          let coverUrl = item.image ? item.image.replace('150x150', '500x500') : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60';
          
          // Construct decrypt/direct audio URL
          let audioUrl = item.media_url || item.url;
          if (item.encrypted_media_url) {
            audioUrl = `https://saavn.dev/api/songs?ids=${item.id}`;
          }

          return {
            id: item.id,
            title: cleanText(item.title),
            artist: cleanText(item.subtitle || item.singers || 'Artist'),
            cover: coverUrl,
            url: item.encrypted_media_url,
            rawUrl: item.url
          };
        });

        // Resolve stream URLs
        fetchAudioStreams();
      } else {
        songListEl.innerHTML = `<p class="text-center text-zinc-500 py-10 text-xs">No songs found for that search query.</p>`;
      }
    };

    async function fetchAudioStreams() {
      try {
        const ids = songs.map(s => s.id).join(',');
        const response = await fetch(`https://saavn.dev/api/songs?ids=${ids}`);
        const data = await response.json();

        if (data.success && data.data) {
          data.data.forEach(item => {
            const foundSong = songs.find(s => s.id === item.id);
            if (foundSong && item.downloadUrl) {
              const bestAudio = item.downloadUrl.find(u => u.quality === '320kbps') || item.downloadUrl[item.downloadUrl.length - 1];
              foundSong.url = bestAudio.link;
              if (item.image && item.image.length > 0) {
                foundSong.cover = item.image[item.image.length - 1].link;
              }
            }
          });
        }
      } catch (e) {
        console.log("Stream details fetched directly on play.");
      }
      renderSongs();
    }

    function cleanText(str) {
      if (!str) return '';
      return str.replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#039;/g, "'");
    }

    function renderSongs() {
      songListEl.innerHTML = '';

      songs.forEach((song, idx) => {
        const isCurrent = currentIndex === idx;
        const card = document.createElement('div');
        card.className = `flex items-center justify-between p-3 rounded-lg cursor-pointer bg-spotify-card transition ${isCurrent ? 'border-l-4 border-green-500' : ''}`;
        card.onclick = () => playSong(idx);

        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden flex-1">
            <img src="${song.cover}" class="w-12 h-12 rounded-md object-cover flex-shrink-0" alt="Cover">
            <div class="overflow-hidden pr-2">
              <p class="text-sm font-semibold truncate ${isCurrent ? 'text-green-500' : 'text-white'}">${song.title}</p>
              <p class="text-xs text-zinc-400 truncate">${song.artist}</p>
            </div>
          </div>
          <span class="text-[10px] text-green-500 font-bold px-2 py-1 bg-zinc-900 rounded border border-green-500/30">FULL HD</span>
        `;
        songListEl.appendChild(card);
      });
      lucide.createIcons();
    }

    async function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentIndex = index;
      const song = songs[currentIndex];

      // If URL needs resolution on the fly
      if (!song.url || !song.url.startsWith('http')) {
        try {
          const res = await fetch(`https://saavn.dev/api/songs?ids=${song.id}`);
          const d = await res.json();
          if (d.data && d.data[0] && d.data[0].downloadUrl) {
            const best = d.data[0].downloadUrl.find(u => u.quality === '320kbps') || d.data[0].downloadUrl[d.data[0].downloadUrl.length - 1];
            song.url = best.link;
          }
        } catch (e) {}
      }

      audio.src = song.url;
      audio.play().then(() => {
        isPlaying = true;
        updateUI();
        setupMediaSession(song);
      }).catch(err => console.log('Playback error:', err));
    }

    function togglePlayPause() {
      if (currentIndex === -1 && songs.length > 0) {
        playSong(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateUI();
    }

    function updateUI() {
      if (currentIndex === -1) return;
      const song = songs[currentIndex];

      document.getElementById('player-cover').src = song.cover;
      document.getElementById('player-title').innerText = song.title;
      document.getElementById('player-artist').innerText = song.artist;

      document.getElementById('full-cover').src = song.cover;
      document.getElementById('full-title').innerText = song.title;
      document.getElementById('full-artist').innerText = song.artist;

      const playIcon = isPlaying ? 'pause' : 'play';
      document.getElementById('play-icon').setAttribute('data-lucide', playIcon);
      document.getElementById('full-play-icon').setAttribute('data-lucide', playIcon);

      renderSongs();
      lucide.createIcons();
    }

    function playNext() {
      if (songs.length === 0) return;
      playSong((currentIndex + 1) % songs.length);
    }

    function playPrev() {
      if (songs.length === 0) return;
      playSong((currentIndex - 1 + songs.length) % songs.length);
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        seekBar.value = progress;
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-duration').innerText = formatTime(audio.duration);
      }
    };

    audio.onended = () => playNext();

    seekBar.oninput = () => {
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    };

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function openFullPlayer() {
      document.getElementById('full-player').classList.remove('translate-y-full');
    }
    function closeFullPlayer() {
      document.getElementById('full-player').classList.add('translate-y-full');
    }

    function setupMediaSession(song) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title,
          artist: song.artist,
          artwork: [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
      }
    }
  </script>
</body>
</html>
